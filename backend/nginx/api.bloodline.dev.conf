# Nginx configuration for api.bloodline.dev
# This file should be copied to /etc/nginx/sites-available/api.bloodline.dev

# HTTP server - serves API and allows Let's Encrypt challenges
server {
    listen 80;
    listen [::]:80;
    server_name api.bloodline.dev;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Logging
    access_log /var/log/nginx/api.bloodline.dev.access.log;
    error_log /var/log/nginx/api.bloodline.dev.error.log;

    # Client body size limit (for file uploads)
    client_max_body_size 10M;

    # Proxy to backend Docker container
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for real-time responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://localhost:5000/health;
    }
}
