<!DOCTYPE html>
<html>
<head>
    <title>Test Hospital API</title>
</head>
<body>
    <h1>Test Hospital Blood Requests API</h1>
    <button onclick="testAPI()">Test API with User ID 16</button>
    <div id="result"></div>
    
    <script>
        async function testAPI() {
            try {
                const response = await fetch('http://localhost:5000/api/hospital/blood-requests/16');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
