<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <!-- Gradient for the blood drop -->
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1121F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blood Drop -->
  <g transform="translate(100, 50)">
    <!-- Drop shape -->
    <path d="M 75 20 C 75 20 30 80 30 115 C 30 145 50 165 75 165 C 100 165 120 145 120 115 C 120 80 75 20 75 20 Z" 
          fill="url(#dropGradient)" 
          stroke="#A01820" 
          stroke-width="2"/>
    
    <!-- Plus sign -->
    <g transform="translate(75, 100)">
      <!-- Horizontal bar -->
      <rect x="-25" y="-8" width="50" height="16" fill="white" rx="3"/>
      <!-- Vertical bar -->
      <rect x="-8" y="-25" width="16" height="50" fill="white" rx="3"/>
    </g>
  </g>
  
  <!-- BLOODLINE Text -->
  <g transform="translate(260, 140)">
    <text font-family="'Arial Black', 'Helvetica Bold', sans-serif" 
          font-size="72" 
          font-weight="900" 
          fill="#C1121F" 
          letter-spacing="2">BLOODLINE</text>
  </g>
  
  <!-- ECG/Heartbeat line -->
  <g transform="translate(260, 180)">
    <path d="M 0 0 L 30 0 L 40 -15 L 50 15 L 60 -10 L 70 5 L 80 0 L 380 0" 
          stroke="#C1121F" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
