<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 62" width="280" height="62">
  <defs>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C1121F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blood Drop Icon -->
  <g transform="translate(0, 0)">
    <path d="M 25 0 C 25 0 10 20 10 30 C 10 40 16 46 25 46 C 34 46 40 40 40 30 C 40 20 25 0 25 0 Z" 
          fill="url(#dropGradient)" 
          stroke="#A01820" 
          stroke-width="1"/>
    
    <!-- Plus sign -->
    <g transform="translate(25, 27)">
      <rect x="-8" y="-2.5" width="16" height="5" fill="white" rx="1"/>
      <rect x="-2.5" y="-8" width="5" height="16" fill="white" rx="1"/>
    </g>
  </g>
  
  <!-- BLOODLINE Text -->
  <text x="60" y="35" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="32" 
        font-weight="900" 
        fill="#C1121F" 
        letter-spacing="1">BLOODLINE</text>
  
  <!-- ECG/Heartbeat line -->
  <path d="M 60 45 L 75 45 L 80 40 L 85 50 L 90 42 L 95 47 L 100 45 L 275 45" 
        stroke="#C1121F" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
