name: Deploy Backend to EC2

on:
  push:
    branches: [dev]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build and push Docker image
      timeout-minutes: 15
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🐳 Building Docker image..."
        cd backend
        docker build --progress=plain --no-cache -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "📤 Pushing to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    
    - name: Upload Nginx configuration to S3
      run: |
        echo "📤 Uploading Nginx configuration to S3..."
        aws s3 cp backend/nginx/api.bloodline.dev.conf s3://${{ secrets.S3_BUCKET_NAME }}/nginx/api.bloodline.dev.conf --region ap-southeast-1
        echo "✅ Nginx configuration uploaded"

    - name: Deploy to EC2
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -e

        echo "🚀 Deploying to EC2..."
        
        # Create deployment script using echo
        echo '#!/bin/bash' > deploy-script.sh
        echo 'set -e' >> deploy-script.sh
        echo 'echo "🔍 === DEPENDENCY CHECK PHASE ==="' >> deploy-script.sh
        echo 'sudo apt update -qq' >> deploy-script.sh
        echo 'if ! command -v docker &> /dev/null; then echo "Installing Docker..."; sudo apt install -y docker.io; sudo systemctl start docker; sudo systemctl enable docker; fi' >> deploy-script.sh
        echo 'if ! command -v aws &> /dev/null; then echo "Installing AWS CLI v2..."; curl -s https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip; sudo apt install -y unzip; unzip -q awscliv2.zip; sudo ./aws/install; fi' >> deploy-script.sh
        echo 'if ! command -v curl &> /dev/null; then sudo apt install -y curl; fi' >> deploy-script.sh
        echo 'if ! command -v netstat &> /dev/null; then sudo apt install -y net-tools; fi' >> deploy-script.sh
        echo 'echo "✅ Dependencies verified"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🔑 === ECR LOGIN PHASE ==="' >> deploy-script.sh
        echo 'aws ecr get-login-password --region ap-southeast-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY || (echo "ECR login failed" && exit 1)' >> deploy-script.sh
        echo 'echo "✅ ECR login successful"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "📥 === IMAGE PULL PHASE ==="' >> deploy-script.sh
        echo 'echo "Pulling image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"' >> deploy-script.sh
        echo 'sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest || (echo "Image pull failed" && exit 1)' >> deploy-script.sh
        echo 'echo "✅ Image pulled successfully"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🛑 === CONTAINER CLEANUP PHASE ==="' >> deploy-script.sh
        echo 'if sudo docker ps -q -f name=bloodline-api; then echo "Stopping existing container..."; sudo docker stop bloodline-api || true; fi' >> deploy-script.sh
        echo 'if sudo docker ps -aq -f name=bloodline-api; then echo "Removing existing container..."; sudo docker rm bloodline-api || true; fi' >> deploy-script.sh
        echo 'echo "✅ Cleanup completed"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🚀 === CONTAINER START PHASE ==="' >> deploy-script.sh
        echo 'echo "Starting container with image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"' >> deploy-script.sh
        echo 'CONTAINER_ID=$(sudo docker run -d --name bloodline-api --restart unless-stopped --network host -e ASPNETCORE_ENVIRONMENT=Production -e AWS_DEFAULT_REGION=ap-southeast-1 $ECR_REGISTRY/$ECR_REPOSITORY:latest)' >> deploy-script.sh
        echo 'echo "Container ID: $CONTAINER_ID"' >> deploy-script.sh
        echo 'echo "Waiting for container to start..."' >> deploy-script.sh
        echo 'sleep 10' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🔍 === CONTAINER VERIFICATION PHASE ==="' >> deploy-script.sh
        echo 'CONTAINER_STATUS=$(sudo docker inspect --format="{{.State.Status}}" bloodline-api)' >> deploy-script.sh
        echo 'echo "Container status: $CONTAINER_STATUS"' >> deploy-script.sh
        echo 'if [ "$CONTAINER_STATUS" != "running" ]; then echo "Container failed to start" && sudo docker logs bloodline-api && exit 1; fi' >> deploy-script.sh
        echo 'echo "✅ Container is running"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🌡️ === HEALTH CHECK PHASE ==="' >> deploy-script.sh
        echo 'echo "Testing port connectivity..."' >> deploy-script.sh
        echo 'for i in {1..10}; do if ss -tlnp | grep :5000; then echo "Port 5000 is listening"; break; elif [ $i -eq 10 ]; then echo "Port 5000 not listening after 10 attempts" && sudo docker logs --tail 20 bloodline-api && exit 1; else echo "Attempt $i/10: Port not ready, waiting..."; sleep 2; fi; done' >> deploy-script.sh
        echo 'echo "Waiting for application startup..."' >> deploy-script.sh
        echo 'for i in {1..30}; do if curl -f -s http://localhost:5000/api/health > /dev/null; then break; fi; echo "Attempt $i/30..."; sleep 2; done' >> deploy-script.sh
        echo 'HEALTH_RESPONSE=$(curl -f -s http://localhost:5000/api/health 2>/dev/null || echo "FAILED")' >> deploy-script.sh
        echo 'echo "Health response: $HEALTH_RESPONSE"' >> deploy-script.sh
        echo 'if [ "$HEALTH_RESPONSE" = "FAILED" ] || ! echo "$HEALTH_RESPONSE" | grep -q "healthy"; then echo "❌ Health check failed after 30 attempts" && echo "=== CONTAINER LOGS ===" && sudo docker logs --tail 100 bloodline-api && exit 1; fi' >> deploy-script.sh
        echo 'echo "✅ Health check passed"' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "🗄️ === DATABASE CONNECTIVITY TEST ==="' >> deploy-script.sh
        echo 'echo "Testing AWS credentials in container..."' >> deploy-script.sh
        echo 'AWS_TEST=$(sudo docker exec bloodline-api aws sts get-caller-identity 2>/dev/null || echo "AWS_FAILED")' >> deploy-script.sh
        echo 'if echo "$AWS_TEST" | grep -q "UserId"; then echo "✅ AWS credentials working"; else echo "❌ AWS credentials failed" && echo "$AWS_TEST"; fi' >> deploy-script.sh
        echo 'echo "Testing Secrets Manager access..."' >> deploy-script.sh
        echo 'SECRET_TEST=$(sudo docker exec bloodline-api aws secretsmanager get-secret-value --secret-id dev-bloodline-db-credentials --region ap-southeast-1 --query SecretString --output text 2>/dev/null || echo "SECRET_FAILED")' >> deploy-script.sh
        echo 'if echo "$SECRET_TEST" | grep -q "endpoint"; then echo "✅ Secrets Manager access working"; else echo "❌ Secrets Manager access failed" && echo "$SECRET_TEST"; fi' >> deploy-script.sh
        echo 'echo "Testing database connection from container..."' >> deploy-script.sh
        echo 'DB_LOGS=$(sudo docker logs --tail 20 bloodline-api 2>&1)' >> deploy-script.sh
        echo 'if echo "$DB_LOGS" | grep -q "Unable to connect.*MySQL"; then echo "❌ Database connection failed" && echo "$DB_LOGS" && exit 1; else echo "✅ No database connection errors found"; fi' >> deploy-script.sh
        echo 'echo "Testing API endpoint that requires database..."' >> deploy-script.sh
        echo 'AUTH_TEST_RESPONSE=$(curl -f -s -X POST http://localhost:5000/api/auth/login -H "Content-Type: application/json" -d "{\"email\":\"test@test.com\",\"password\":\"test\"}" 2>/dev/null || echo "AUTH_FAILED")' >> deploy-script.sh
        echo 'if echo "$AUTH_TEST_RESPONSE" | grep -q "success\|Invalid"; then echo "✅ Database connectivity verified (API responds)"; else echo "⚠️ Database connectivity uncertain - API may have issues" && echo "Response: $AUTH_TEST_RESPONSE"; fi' >> deploy-script.sh
        echo 'echo' >> deploy-script.sh
        echo 'echo "📊 === DEPLOYMENT SUMMARY ==="' >> deploy-script.sh
        echo 'echo "Container name: bloodline-api"' >> deploy-script.sh
        echo 'echo "Container status: $(sudo docker inspect --format=\"{{.State.Status}}\" bloodline-api)"' >> deploy-script.sh
        echo 'echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"' >> deploy-script.sh
        echo 'echo "Port mapping: $(sudo docker port bloodline-api)"' >> deploy-script.sh
        echo 'echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY!"' >> deploy-script.sh
        echo 'exit 0' >> deploy-script.sh

        # Upload deployment script to S3
        aws s3 cp deploy-script.sh s3://${{ secrets.S3_BUCKET_NAME }}/deploy-script.sh
        
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "export ECR_REGISTRY='$ECR_REGISTRY'",
            "export ECR_REPOSITORY='$ECR_REPOSITORY'",
            "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/deploy-script.sh /tmp/deploy-script.sh",
            "chmod +x /tmp/deploy-script.sh",
            "/tmp/deploy-script.sh"
          ]' \
          --region ap-southeast-1 \
          --query 'Command.CommandId' \
          --output text)
        
        echo "📋 Command ID: $COMMAND_ID"
        
        # Clean up local script
        rm -f deploy-script.sh
        echo "⏳ Waiting for deployment..."
        
        # Wait for command completion (max 150 seconds)
        DEPLOYMENT_SUCCESS=false
        for i in {1..15}; do
          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'Status' \
            --output text 2>/dev/null || echo "InProgress")
          
          echo "Status: $STATUS (attempt $i/15)"
          
          if [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment successful!"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardOutputContent' \
              --output text
            DEPLOYMENT_SUCCESS=true
            break
          elif [ "$STATUS" = "Failed" ]; then
            echo "❌ Deployment failed!"
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardOutputContent' \
              --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          
          sleep 10
        done
        
        # Handle timeout only if deployment didn't succeed
        if [ "$DEPLOYMENT_SUCCESS" = "false" ]; then
          echo "⚠️ Deployment timed out after 150 seconds"
          echo "Final status: $STATUS"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'StandardOutputContent' \
            --output text || echo "No output available"
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'StandardErrorContent' \
            --output text || echo "No error output available"
          exit 1
        fi

    - name: Setup Nginx and SSL
      run: |
        set -e

        echo "🔧 Setting up Nginx reverse proxy..."

        # Create Nginx setup script
        echo '#!/bin/bash' > setup-nginx.sh
        echo 'set -e' >> setup-nginx.sh
        echo 'echo "🔧 === NGINX SETUP PHASE ==="' >> setup-nginx.sh
        echo 'echo "Checking if Nginx is already installed..."' >> setup-nginx.sh
        echo 'if ! command -v nginx &> /dev/null; then' >> setup-nginx.sh
        echo '  echo "📦 Installing Nginx..."' >> setup-nginx.sh
        echo '  sudo apt-get update -qq' >> setup-nginx.sh
        echo '  sudo apt-get install -y nginx' >> setup-nginx.sh
        echo '  echo "✅ Nginx installed"' >> setup-nginx.sh
        echo 'else' >> setup-nginx.sh
        echo '  echo "✅ Nginx already installed"' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "Checking if Certbot is already installed..."' >> setup-nginx.sh
        echo 'if ! command -v certbot &> /dev/null; then' >> setup-nginx.sh
        echo '  echo "📦 Installing Certbot..."' >> setup-nginx.sh
        echo '  sudo apt-get install -y certbot python3-certbot-nginx' >> setup-nginx.sh
        echo '  echo "✅ Certbot installed"' >> setup-nginx.sh
        echo 'else' >> setup-nginx.sh
        echo '  echo "✅ Certbot already installed"' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "📁 Creating certbot directory..."' >> setup-nginx.sh
        echo 'sudo mkdir -p /var/www/certbot' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "📄 Copying Nginx configuration..."' >> setup-nginx.sh
        echo 'if [ ! -f /home/ubuntu/backend/nginx/api.bloodline.dev.conf ]; then' >> setup-nginx.sh
        echo '  echo "❌ Nginx config file not found at /home/ubuntu/backend/nginx/api.bloodline.dev.conf"' >> setup-nginx.sh
        echo '  exit 1' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'sudo cp /home/ubuntu/backend/nginx/api.bloodline.dev.conf /etc/nginx/sites-available/api.bloodline.dev' >> setup-nginx.sh
        echo 'echo "✅ Configuration copied"' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "🗑️ Removing default site if exists..."' >> setup-nginx.sh
        echo 'if [ -f /etc/nginx/sites-enabled/default ]; then' >> setup-nginx.sh
        echo '  sudo rm /etc/nginx/sites-enabled/default' >> setup-nginx.sh
        echo '  echo "✅ Default site removed"' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "🔗 Enabling api.bloodline.dev site..."' >> setup-nginx.sh
        echo 'sudo ln -sf /etc/nginx/sites-available/api.bloodline.dev /etc/nginx/sites-enabled/' >> setup-nginx.sh
        echo 'echo "✅ Site enabled"' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "✅ Testing Nginx configuration..."' >> setup-nginx.sh
        echo 'sudo nginx -t' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "🔄 Restarting Nginx..."' >> setup-nginx.sh
        echo 'sudo systemctl restart nginx' >> setup-nginx.sh
        echo 'sudo systemctl enable nginx' >> setup-nginx.sh
        echo 'echo "✅ Nginx restarted and enabled"' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "🔐 === SSL CERTIFICATE PHASE ==="' >> setup-nginx.sh
        echo 'echo "Checking if SSL certificate already exists..."' >> setup-nginx.sh
        echo 'if [ -f /etc/letsencrypt/live/api.bloodline.dev/fullchain.pem ]; then' >> setup-nginx.sh
        echo '  echo "✅ SSL certificate already exists"' >> setup-nginx.sh
        echo '  echo "🔄 Reloading Nginx to apply any config changes..."' >> setup-nginx.sh
        echo '  sudo systemctl reload nginx' >> setup-nginx.sh
        echo 'else' >> setup-nginx.sh
        echo '  echo "📜 Obtaining SSL certificate from Let'\''s Encrypt..."' >> setup-nginx.sh
        echo '  sudo certbot --nginx -d api.bloodline.dev --non-interactive --agree-tos --email admin@bloodline.dev' >> setup-nginx.sh
        echo '  echo "✅ SSL certificate obtained"' >> setup-nginx.sh
        echo '  echo' >> setup-nginx.sh
        echo '  echo "⏰ Setting up certificate auto-renewal..."' >> setup-nginx.sh
        echo '  sudo systemctl enable certbot.timer' >> setup-nginx.sh
        echo '  sudo systemctl start certbot.timer' >> setup-nginx.sh
        echo '  echo "✅ Auto-renewal configured"' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "🌐 === NGINX VERIFICATION ==="' >> setup-nginx.sh
        echo 'NGINX_STATUS=$(sudo systemctl is-active nginx)' >> setup-nginx.sh
        echo 'echo "Nginx status: $NGINX_STATUS"' >> setup-nginx.sh
        echo 'if [ "$NGINX_STATUS" != "active" ]; then' >> setup-nginx.sh
        echo '  echo "❌ Nginx is not running"' >> setup-nginx.sh
        echo '  exit 1' >> setup-nginx.sh
        echo 'fi' >> setup-nginx.sh
        echo 'echo "✅ Nginx is running"' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "Testing HTTPS endpoint..."' >> setup-nginx.sh
        echo 'for i in {1..10}; do' >> setup-nginx.sh
        echo '  if curl -f -s -k https://api.bloodline.dev/api/health > /dev/null 2>&1; then' >> setup-nginx.sh
        echo '    echo "✅ HTTPS endpoint is responding"' >> setup-nginx.sh
        echo '    break' >> setup-nginx.sh
        echo '  fi' >> setup-nginx.sh
        echo '  if [ $i -eq 10 ]; then' >> setup-nginx.sh
        echo '    echo "⚠️ HTTPS endpoint not responding after 10 attempts"' >> setup-nginx.sh
        echo '  else' >> setup-nginx.sh
        echo '    echo "Attempt $i/10: Waiting for HTTPS..."' >> setup-nginx.sh
        echo '    sleep 2' >> setup-nginx.sh
        echo '  fi' >> setup-nginx.sh
        echo 'done' >> setup-nginx.sh
        echo 'echo' >> setup-nginx.sh
        echo 'echo "✅ NGINX SETUP COMPLETED SUCCESSFULLY!"' >> setup-nginx.sh
        echo 'exit 0' >> setup-nginx.sh

        # Upload Nginx setup script to S3
        aws s3 cp setup-nginx.sh s3://${{ secrets.S3_BUCKET_NAME }}/setup-nginx.sh

        # First, ensure backend directory exists and copy Nginx config
        PREP_COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "mkdir -p /home/ubuntu/backend/nginx",
            "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/nginx/api.bloodline.dev.conf /home/ubuntu/backend/nginx/api.bloodline.dev.conf"
          ]' \
          --region ap-southeast-1 \
          --query 'Command.CommandId' \
          --output text)

        echo "📋 Prep Command ID: $PREP_COMMAND_ID"
        echo "⏳ Waiting for preparation..."
        sleep 10

        # Execute Nginx setup script
        NGINX_COMMAND_ID=$(aws ssm send-command \
          --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/setup-nginx.sh /tmp/setup-nginx.sh",
            "chmod +x /tmp/setup-nginx.sh",
            "/tmp/setup-nginx.sh"
          ]' \
          --region ap-southeast-1 \
          --query 'Command.CommandId' \
          --output text)

        echo "📋 Nginx Command ID: $NGINX_COMMAND_ID"

        # Clean up local script
        rm -f setup-nginx.sh
        echo "⏳ Waiting for Nginx setup..."

        # Wait for command completion (max 120 seconds)
        NGINX_SUCCESS=false
        for i in {1..12}; do
          STATUS=$(aws ssm get-command-invocation \
            --command-id $NGINX_COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'Status' \
            --output text 2>/dev/null || echo "InProgress")

          echo "Status: $STATUS (attempt $i/12)"

          if [ "$STATUS" = "Success" ]; then
            echo "✅ Nginx setup successful!"
            aws ssm get-command-invocation \
              --command-id $NGINX_COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardOutputContent' \
              --output text
            NGINX_SUCCESS=true
            break
          elif [ "$STATUS" = "Failed" ]; then
            echo "❌ Nginx setup failed!"
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id $NGINX_COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardOutputContent' \
              --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id $NGINX_COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --region ap-southeast-1 \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi

          sleep 10
        done

        # Handle timeout
        if [ "$NGINX_SUCCESS" = "false" ]; then
          echo "⚠️ Nginx setup timed out after 120 seconds"
          echo "Final status: $STATUS"
          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id $NGINX_COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'StandardOutputContent' \
            --output text || echo "No output available"
          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id $NGINX_COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
            --region ap-southeast-1 \
            --query 'StandardErrorContent' \
            --output text || echo "No error output available"
          exit 1
        fi